<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMORY VAULT // 秘密基地門鎖</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-pink: #f472b6;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 480px;
      text-align: center;
      position: relative;
    }

    .hidden { display: none !important; }

    /* 按鈕基礎樣式 */
    .btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.3s ease;
      position: relative;
    }
    .btn:hover { background: var(--accent-blue); color: #0f172a; }
    .btn-accent { background: var(--accent-blue); color: #0f172a; }

    /* 「三年內」按鈕掉落動畫階梯 */
    .drop-stage-1 { transform: translateY(15px) rotate(5deg) !important; }
    .drop-stage-2 { transform: translateY(35px) rotate(-12deg) !important; }
    .drop-stage-3 {
      transform: translateY(200px) rotate(45deg) !important;
      opacity: 0;
      pointer-events: none;
    }

    /* 輸入框 */
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #334155;
      background: #0f172a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }

    /* 倒數計時 */
    .timer-display {
      font-size: 2rem;
      font-family: monospace;
      color: var(--accent-pink);
      margin: 15px 0;
    }

    /* 4格圖片拼圖網格 */
    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
