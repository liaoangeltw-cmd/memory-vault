<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMORY VAULT // 秘密基地門鎖</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-pink: #f472b6;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 480px;
      text-align: center;
      position: relative;
    }

    .hidden { display: none !important; }

    /* 按鈕基礎樣式 */
    .btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.3s ease;
      position: relative;
    }
    .btn:hover { background: var(--accent-blue); color: #0f172a; }
    .btn-accent { background: var(--accent-blue); color: #0f172a; }

    /* 「三年內」按鈕掉落動畫階梯 */
    .drop-stage-1 {
      transform: translateY(15px) rotate(5deg) !important;
    }
    .drop-stage-2 {
      transform: translateY(35px) rotate(-12deg) !important;
    }
    .drop-stage-3 {
      transform: translateY(200px) rotate(45deg) !important;
      opacity: 0;
      pointer-events: none;
    }

    /* 輸入框 */
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #334155;
      background: #0f172a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }

    /* 倒數計時 */
    .timer-display {
      font-size: 2rem;
      font-family: monospace;
      color: var(--accent-pink);
      margin: 15px 0;
    }

    /* 4 格圖片網格 */
    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .quiz-grid img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .feedback {
      min-height: 2rem;
      color: var(--accent-pink);
      font-weight: bold;
      margin-top: 10px;
    }

    /* 文學扉頁 */
    .poem-box {
      font-size: 1.3rem;
      line-height: 1.8;
      letter-spacing: 2px;
      color: var(--accent-blue);
      margin: 20px 0;
    }

    /* DC 閃爍彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 2px solid var(--accent-blue);
      text-align: center;
      max-width: 360px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes flashAnim {
      0% { background-color: #fff; }
      50% { background-color: #f472b6; }
      100% { background-color: var(--bg-color); }
    }
    .flash { animation: flashAnim 0.4s ease; }
  </style>
</head>
<body id="mainBody">

  <div class="container">
    
    <!-- STAGE 0: 時間選擇入口 -->
    <div id="stage0">
      <h2>MEMORY VAULT // 進入座標</h2>
      <p>請選擇你目前的時空狀態：</p>
      <button class="btn" id="within3Btn" onclick="clickWithin3()">【 三年內 】</button>
      <button class="btn" onclick="selectTimeMode('after3')">【 三年後 】</button>
      <div id="modeFeedback" class="feedback"></div>
    </div>

    <!-- STAGE 1: 時空倒數 -->
    <div id="stage1" class="hidden">
      <h3>⌛ 時空傳輸與資料解封中...</h3>
      <div class="timer-display" id="timer">00:03</div>
      <p id="timerSubtext">正在連結回憶記憶庫...</p>
    </div>

    <!-- STAGE 2: 惡搞問答區 -->
    <div id="stage2" class="hidden">
      <h3 id="quizTitle">問答關卡</h3>
      <div id="quizContent"></div>
      <div class="feedback" id="quizFeedback"></div>
    </div>

    <!-- STAGE 3: 實體卡片終極密碼 -->
    <div id="stage3" class="hidden">
      <h3>🔑 終極金鑰解密</h3>
      <p id="passcodePrompt">請輸入你實體卡片上的謎題解答：</p>
      <input type="text" id="finalPasscode" placeholder="請輸入解答..." autocomplete="off">
      <button class="btn btn-accent" id="verifyBtn" onclick="verifyFinalPasscode()">驗證解密</button>
      <div class="feedback" id="finalFeedback"></div>
    </div>

    <!-- STAGE 4: 排行榜登錄 & 文學扉頁 & 時光膠囊 -->
    <div id="stage4" class="hidden">
      <h3>✨ 解鎖成功 ✨</h3>
      <div class="poem-box" id="poemDisplay"></div>

      <hr style="border-color: #334155; margin: 20px 0;">

      <h4>📜 時光膠囊登錄</h4>
      <input type="text" id="nicknameInput" placeholder="請輸入你的暱稱/代號">
      <textarea id="capsuleInput" rows="3" placeholder="寫下一段話給後面解鎖的人..."></textarea>
      <button class="btn btn-accent" onclick="submitCapsule()">封存留言並送出</button>
    </div>

  </div>

  <!-- STAGE 5: 閃爍 DC 彈窗 -->
  <div id="dcModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2 style="color: var(--accent-pink);">⚡ ACCESS GRANTED</h2>
      <p>恭喜歸隊！點擊下方按鈕加入專屬討論區，看看大家都在裡面吐槽什麼：</p>
      <a href="https://discord.gg/x3H7e6mD2" target="_blank" style="text-decoration: none;">
        <button class="btn btn-accent" style="margin-top: 15px;">👾 進入 Discord 秘密頻道</button>
      </a>
    </div>
  </div>

  <script>
    // --- 密碼與詩句庫 ---
    // 一般模式下只能對照 keys，救濟模式（錯3次）才能對照 id
    const VAULT_KEYS = {
      gate_01: { 
        id: "1",
        keys: ["16", "卡片1", "第一張"], 
        poem: "「願你如高天之上的候鳥，與光同在。」" 
      },
      gate_02: { 
        id: "2",
        keys: ["算錯的時候", "算錯", "卡片2", "第二張"], 
        poem: "「願你如暴雪後的寒梅，終得陽光。」" 
      },
      gate_03: { 
        id: "3",
        keys: ["我也不記得", "不記得", "數不勝數", "太多了", "卡片3", "第三張"], 
        poem: "「願你如你的故事，精彩繽紛。」" 
      },
      gate_04: { 
        id: "4",
        keys: ["把我的心勾走了", "心勾走了", "其他人不好說", "卡片4", "第四張"], 
        poem: "「願你如長途漂泊的旅客，帶著豐富的見聞與我們相會。」" 
      }
    };

    // --- STAGE 0: 時間選擇 ---
    let within3Clicks = 0;
    function clickWithin3() {
      within3Clicks++;
      const btn = document.getElementById('within3Btn');
      const fb = document.getElementById('modeFeedback');

      if (within3Clicks === 1) {
        btn.classList.add('drop-stage-1');
        fb.innerText = "按鈕好像鬆動了...才過多久就忍不住點進來？🫵";
      } else if (within3Clicks === 2) {
        btn.classList.remove('drop-stage-1');
        btn.classList.add('drop-stage-2');
        fb.innerText = "再點要掉下去了喔！是有多迫不及待啦！";
      } else if (within3Clicks >= 3) {
        btn.classList.remove('drop-stage-2');
        btn.classList.add('drop-stage-3');
        fb.innerText = "喂！按鈕壞掉了啦！💥";
        setTimeout(() => {
          document.getElementById('stage0').classList.add('hidden');
          document.getElementById('stage1').classList.remove('hidden');
          startCountdown();
        }, 1200);
      }
    }

    function selectTimeMode(mode) {
      const fb = document.getElementById('modeFeedback');
      fb.innerText = "少那邊裝，時間根本還沒到好嗎！給我乖乖等三年啦";
    }

    // --- STAGE 1: 倒數計時 ---
    function startCountdown() {
      let sec = 3;
      const timerEl = document.getElementById('timer');
      const interval = setInterval(() => {
        sec--;
        timerEl.innerText = `00:0${sec}`;
        if(sec <= 0) {
          clearInterval(interval);
          document.getElementById('stage1').classList.add('hidden');
          document.getElementById('stage2').classList.remove('hidden');
          loadQuiz(0);
        }
      }, 1000);
    }

    // --- STAGE 2: 惡搞問答區 ---
    let currentQuizIndex = 0;
    let quizFailCount = 0;

    const QUIZ_DATA = [
      {
        title: "Q1: 請問永德以前的綽號是什麼？",
        gridImgs: null,
        options: [
          { text: "A. 香蕉哥哥", msg: "香蕉哥哥？你認真？", correct: false },
          { text: "B. 青蛙", msg: "答對了！真虧你還記得", correct: true },
          { text: "C. 兄弟你好香啊", msg: "讓我看看！", correct: false },
          { text: "D. jojo 我不當人了！", msg: "就知道某人一定會點", correct: false }
        ]
      },
      {
        title: "Q2: 請問照片中哪一個才是瘦辰？",
        gridImgs: [
          "https://lh3.googleusercontent.com/d/1zTZPvjQz28bh_Le4Z71X00kvJVs_0Ga2", // 左上：藍衣大哥
          "https://lh3.googleusercontent.com/d/1JKKZqnhiVDxAWAV0CZ35kELlI9k2ewOE", // 右上：水墨詩人
          "https://lh3.googleusercontent.com/d/1rNmm5QpcjB1NDifdFBGEquAkhxtQG6rs", // 左下：炸雞
          "https://lh3.googleusercontent.com/d/1vEh-HMODh5SBPq8hHiQAUK5qoiNruOa7"  // 右下：窩不知道
        ],
        options: [
          { text: "A. 左上角那個", msg: "眼科關心您的視力，請盡快就診", correct: false },
          { text: "B. 右上角那個", msg: "沒那麼老吧！", correct: false },
          { text: "C. 左下角那個", msg: "炸雞！沒錯就是他！", correct: true },
          { text: "D. 都不是，這是新物種", msg: "隨便選一個都比較好吧！", correct: false }
        ]
      },
      {
        title: "Q3: 請問我是誰？",
        gridImgs: null,
        options: [
          { text: "A. 變態", msg: "才不是！你才變態！🫵", correct: false },
          { text: "B. 大變態", msg: "越說越過份了是不是！", correct: false },
          { text: "C. 超級大變態", msg: "是怎樣啦！", correct: false },
          { text: "D. 以上皆是", msg: "怎麼想都不是這個吧！", correct: false }
        ]
      }
    ];

    function loadQuiz(index) {
      currentQuizIndex = index;
      quizFailCount = 0;
      const q = QUIZ_DATA[index];
      const fb = document.getElementById('quizFeedback');
      fb.innerText = "";

      let html = `<h4>${q.title}</h4>`;
      
      if (q.gridImgs && q.gridImgs.length === 4) {
        html += `
          <div class="quiz-grid">
            <img src="${q.gridImgs[0]}" alt="左上">
            <img src="${q.gridImgs[1]}" alt="右上">
            <img src="${q.gridImgs[2]}" alt="左下">
            <img src="${q.gridImgs[3]}" alt="右下">
          </div>
        `;
      }

      q.options.forEach((opt, optIdx) => {
        html += `<button class="btn" onclick="answerQuiz(${optIdx})">${opt.text}</button>`;
      });

      document.getElementById('quizContent').innerHTML = html;
    }

    function answerQuiz(optIdx) {
      const q = QUIZ_DATA[currentQuizIndex];
      const selected = q.options[optIdx];
      const fb = document.getElementById('quizFeedback');

      if(currentQuizIndex === 2) {
        quizFailCount++;
        if(quizFailCount >= 3) {
          fb.style.color = "#f472b6";
          fb.innerText = "欸不是你禮貌嗎 😡？！算了不跟你計較，直接進下一關啦！";
          setTimeout(() => {
            document.getElementById('stage2').classList.add('hidden');
            document.getElementById('stage3').classList.remove('hidden');
          }, 2000);
        } else {
          fb.innerText = selected.msg;
        }
        return;
      }

      if(selected.correct) {
        fb.style.color = "#38bdf8";
        fb.innerText = selected.msg;
        setTimeout(() => {
          if(currentQuizIndex + 1 < QUIZ_DATA.length) {
            loadQuiz(currentQuizIndex + 1);
          } else {
            document.getElementById('stage2').classList.add('hidden');
            document.getElementById('stage3').classList.remove('hidden');
          }
        }, 1200);
      } else {
        fb.style.color = "#f87171";
        fb.innerText = selected.msg;
      }
    }

    // --- STAGE 3: 實體密碼驗證 (一般模式/救濟模式分流) ---
    let finalFailCount = 0;
    let isRescueMode = false;

    document.getElementById('finalPasscode').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        verifyFinalPasscode();
      }
    });

    function verifyFinalPasscode() {
      const inputEl = document.getElementById('finalPasscode');
      const val = inputEl.value.trim().toLowerCase();
      const fb = document.getElementById('finalFeedback');

      // 1. 救濟模式：錯滿 3 次後啟動，支援輸入卡片號碼 (1~4) 或題目關鍵字
      if (isRescueMode) {
        let matchedPoem = null;
        for(let key in VAULT_KEYS) {
          const item = VAULT_KEYS[key];
          if(val === item.id || item.keys.some(k => val.includes(k.toLowerCase()))) {
            matchedPoem = item.poem;
            break;
          }
        }

        if(matchedPoem) {
          fb.style.color = "#38bdf8";
          fb.innerText = "辨識成功！";
          setTimeout(() => unlockVault(matchedPoem), 1200);
        } else {
          fb.style.color = "#f87171";
          fb.innerText = "無法辨識卡片！請輸入卡片編號（1、2、3、4）或題目關鍵字！";
        }
        return;
      }

      // 2. 一般模式：前三次必須精準輸入謎題解答
      let matched = null;
      for(let key in VAULT_KEYS) {
        if(VAULT_KEYS[key].keys.some(k => val.includes(k.toLowerCase()))) {
          matched = VAULT_KEYS[key];
          break;
        }
      }

      if(matched) {
        unlockVault(matched.poem);
      } else {
        finalFailCount++;
        if(finalFailCount < 3) {
          fb.style.color = "#f87171";
          fb.innerText = "解答錯誤！算什麼算！答案根本不在公式裡！";
        } else {
          // 錯滿 3 次啟動智商救濟
          isRescueMode = true;
          fb.style.color = "#38bdf8";
          fb.innerHTML = "🚨 <strong>智商救濟機制啟動！</strong><br>算了一看就知道你沒算出來！<br>請在上方輸入框輸入<strong>「你的卡片編號 (1~4)」</strong>或<strong>「題目第一句/關鍵字」</strong>：";
          
          document.getElementById('passcodePrompt').innerText = "請輸入你的卡片編號 (1-4) 或題目關鍵字：";
          inputEl.value = "";
          inputEl.placeholder = "例如：1 或 算錯的時候...";
          document.getElementById('verifyBtn').innerText = "領取你的專屬寄語";
        }
      }
    }

    function unlockVault(poemText) {
      document.getElementById('stage3').classList.add('hidden');
      document.getElementById('stage4').classList.remove('hidden');
      document.getElementById('poemDisplay').innerText = poemText;
    }

    // --- STAGE 4: 膠囊送出與 DC 閃爍彈窗 ---
    function submitCapsule() {
      const name = document.getElementById('nicknameInput').value.trim();
      const msg = document.getElementById('capsuleInput').value.trim();

      if(!name || !msg) {
        alert("請輸入暱稱與留言再送出喔！");
        return;
      }

      document.getElementById('mainBody').classList.add('flash');
      setTimeout(() => {
        document.getElementById('mainBody').classList.remove('flash');
        document.getElementById('dcModal').classList.remove('hidden');
      }, 400);
    }
  </script>
</body>
</html>
